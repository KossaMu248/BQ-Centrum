name: Publish playable BQ-Centrum

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: centrum-runtime-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the independent project
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Pages staging boundaries
        run: python3 tests/centrum_pages_staging.py
      - name: Stage runtime, original assets and attribution
        run: python3 tools/stage-pages.py --output delivery/pages-site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload standalone site
        uses: actions/upload-pages-artifact@v3
        with:
          path: delivery/pages-site
      - name: Wait for the automatic branch build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time
          repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))
          if api(f'repos/{repo}/pages').get('build_type') == 'legacy':
              # Built-in Pages runs do not emit workflow_run. Wait explicitly;
              # their larger artifact must finish before this one is deployed.
              deadline = time.monotonic() + 600
              while True:
                  runs = api(f'repos/{repo}/actions/runs?head_sha={sha}&per_page=100')['workflow_runs']
                  branch = [r for r in runs if r['name'] == 'pages build and deployment']
                  if branch and all(r['status'] == 'completed' for r in branch):
                      print('Automatic branch build finished; deploying the runtime artifact.')
                      break
                  if time.monotonic() >= deadline:
                      raise SystemExit('Automatic branch build has not finished; refusing to race deployments.')
                  time.sleep(5)
          PY
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
